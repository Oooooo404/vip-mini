name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-cov fastapi uvicorn pymysql dbutils passlib[bcrypt] python-jose[cryptography]
      - run: pytest tests/ --cov=service --cov-fail-under=70